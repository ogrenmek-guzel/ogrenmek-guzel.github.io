<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>{{title}}</title>
<link rel="manifest" href="{{root}}manifest.webmanifest">
<link rel="apple-touch-icon" href="{{root}}icons/icon-180.png">
<link rel="icon" type="image/png" href="{{root}}icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{app_name}}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF8EE">
<link rel="stylesheet" href="{{root}}style.css">
{{head}}
</head>
<body class="{{body_class}}" data-root="{{root}}">
{{nav}}
<main>
{{content}}
</main>
<script src="{{root}}app.js"></script>
{{scripts}}
</body>
</html>
