# Puts the website (the site/ folder) online with GitHub Pages every time main changes.
# The safety check runs first; if it fails, nothing is published.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Safety check
        env:
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
        run: python3 tools/check.py --ci
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
